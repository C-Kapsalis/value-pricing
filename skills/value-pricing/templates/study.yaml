# study.yaml — the one config every script reads. Copy to pricing-study/study.yaml and fill it.
# Values shown are a worked example (a B2B analytics app for online stores); replace all of them.
# Any number may be a per-segment map {segment_id: value}. Quote text values in inline maps: a comma
# inside an unquoted value ends it. Expressions are Python/numpy over the
# scenario's variables (np, rng and n are available).

product:
  name: Acme Analytics
  url: https://example.com
  # Shown to panel respondents. Plain, factual, no prices.
  description: >-
    Acme Analytics connects your store and marketing data, models it into one set of metric
    definitions, and gives you dashboards plus an AI analyst that returns diagnoses and actions.

currency: EUR
fx: {USD: 0.90, date: "YYYY-MM-DD"}         # 1 unit of the listed currency = x study currency; one rate per run

segments:
  axis: monthly_orders                      # the quantity value scales with (owner rules); plans.csv limit_<axis>
  axis_label: orders per month
  bands:                                    # range = [low, high); high null = open
    - {id: micro, range: [1, 200],         reference_volume: 80,    share: 0.55}
    - {id: small, range: [200, 2000],      reference_volume: 700,   share: 0.27}
    - {id: mid,   range: [2000, 20000],    reference_volume: 6000,  share: 0.15}
    - {id: large, range: [20000, 200000],  reference_volume: 40000, share: 0.03}

archetypes:                                 # 3-5 buyer shapes; shares within each segment
  - id: fashion_dtc
    label: direct-to-consumer fashion brand
    business_model: sells its own apparel online, mostly through paid social
    share: {micro: 0.6, small: 0.55, mid: 0.5, large: 0.45}
    roles: {micro: [founder who also runs marketing], small: [marketing manager], mid: [head of growth], large: [marketing director]}
    team: {micro: you alone, small: 1-2 people, mid: an in-house team of 4-8, large: a team of 15+ with an analyst}
    reference_alternative:                  # what they do today instead, and its monthly cost
      text: {micro: "the platforms' own dashboards and a spreadsheet", small: "a connector tool feeding a spreadsheet", mid: "a connector tool feeding a BI tool", large: "an ETL tool, a warehouse and a BI tool"}
      cost: {micro: 0, small: 50, mid: 250, large: 1200}
  - id: home_goods
    label: home and lifestyle retailer
    business_model: sells home goods online and in a few physical stores
    share: {micro: 0.4, small: 0.45, mid: 0.5, large: 0.55}
    roles: {micro: [owner], small: [ecommerce manager], mid: [ecommerce director], large: [head of digital]}
    team: {micro: you alone, small: 1-2 people, mid: an in-house team of 3-6, large: a digital team of 10+}
    reference_alternative:
      text: {micro: "spreadsheets", small: "spreadsheets updated by hand", mid: "a BI tool maintained by an agency", large: "an agency-run reporting stack"}
      cost: {micro: 0, small: 0, mid: 350, large: 1800}

scenarios:                                  # phase 3: one row per simulated customer-month
  n: 10000
  seed: 12345
  variables:                                # evaluated in order; dist or expr
    volume:        {dist: band}             # log-uniform inside the segment band
    aov:           {dist: lognormal, median: 60, sigma: 0.5}
    gmv:           {expr: "volume * aov"}
    gross_margin:  {dist: uniform, low: 0.35, high: 0.65}
    has_ads:       {dist: bernoulli, p: {micro: 0.4, small: 0.6, mid: 0.8, large: 0.9}}
    ad_spend:      {expr: "has_ads * gmv * np.clip(rng.lognormal(np.log(0.12), 0.5, n), 0.02, 0.4)"}
    refund_rate:   {dist: beta, a: 2, b: 30}
    yoy_growth:    {dist: normal, mean: 0.05, sd: 0.25}
    hourly_rate:   {dist: per_segment, values: {micro: 35, small: 45, mid: 60, large: 75}}
    # other dists: per_archetype {values: {arch_id: x}}, choice {options: [..], p: [..]}
  # Is a feature actually in use for this customer? Default: always. Gates go here.
  feature_in_use:
    ad_platform_connectors: "has_ads > 0"

conjoint:                                   # phase 4b; attribute names from taxonomy.yaml `conjoint:`
  attributes:                               # price first; other levels ordered worst → best
    price: [12, 25, 50, 100, 200, 400, 800]
    sources: ["store data only", "store + 3 marketing sources", "store + all marketing sources"]
    ai_depth: ["dashboards only", "dashboards + AI chat", "dashboards + AI chat + recommended actions"]
    onboarding: ["self-serve setup", "guided onboarding call"]
    support: ["email support", "priority support with a named contact"]
  labels: {price: price, sources: data sources, ai_depth: analysis and AI, onboarding: setup, support: support}
  our_config: {sources: 2, ai_depth: 2, onboarding: 0, support: 0}   # level index per attribute; VW/GG ask about it
  versions: 60
  tasks: 12
  alternatives: 3
  anchors: [25, 60]                         # the owner's anchors, as listing-price manipulations, never candidates
  paraphrases: 2
  personas_per_segment: 60
  min_personas_per_archetype: 4
  model: claude-opus-5-5
  frame_csv: null                           # optional: real buyer rows (segment, archetype, attributes; hashed ids only)

council:
  personas: []                              # optional user-defined buyer cards, added to the inferred ones

cost:
  margin_targets: [0.70, 0.80, 0.85]
  candidate_prices: [15, 29, 59, 179]

lenses:                                     # phase 6 scores every proposal under each
  calibration_ratio: 1.48                   # silicon / human WTP from the panel's calibration (upper end)
  evc_capture: 0.30

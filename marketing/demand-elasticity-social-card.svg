  <text x="58" y="194" fill="#f5f7f8" font-family="Arial, Helvetica, sans-serif" font-size="61" font-weight="700">Bayesian demand</text>
  <text x="58" y="268" fill="#f5f7f8" font-family="Arial, Helvetica, sans-serif" font-size="61" font-weight="700">elasticity</text>
  <text x="61" y="337" fill="#c7d7e4" font-family="Arial, Helvetica, sans-serif" font-size="28">Historical transactions</text>

  <text x="61" y="421" fill="#c7d7e4" font-family="Arial, Helvetica, sans-serif" font-size="28">90% credible intervals</text>
  <rect x="59" y="494" width="344" height="64" rx="32" fill="#f0c36e"/>
  <text x="86" y="535" fill="#102a43" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700">Observational evidence</text>

  <rect x="653" y="112" width="491" height="420" rx="25" fill="#193c58" stroke="#42627c" stroke-width="2"/>
  <text x="691" y="164" fill="#f5f7f8" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" letter-spacing="2">PRICE RESPONSE</text>

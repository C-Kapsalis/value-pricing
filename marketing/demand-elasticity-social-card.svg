<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Value Pricing: Bayesian demand elasticity</title>
  <desc id="desc">A conceptual price-response curve beside text about historical transactions, segment estimates, 90 percent credible intervals, and observational evidence. The curve is illustrative and contains no real data.</desc>
